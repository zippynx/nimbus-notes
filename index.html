<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nimbus Notes — Cloud Storage for Your Thoughts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo">
      <div class="logo-icon">☁️</div>
      <div>
        <div class="logo-text">Nimbus<span>Notes</span></div>
        <div class="tagline">Cloud Storage for Your Thoughts</div>
      </div>
    </div>
    <div class="clock-block">
      <div id="clock">--:--:--</div>
      <div id="date">Loading...</div>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-dot blue"></div>
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label">total notes</span>
    </div>
    <div class="stat">
      <div class="stat-dot purple"></div>
      <span class="stat-value" id="stat-today">0</span>
      <span class="stat-label">added today</span>
    </div>
    <div class="stat">
      <div class="stat-dot green"></div>
      <span class="stat-value" id="stat-chars">0</span>
      <span class="stat-label">total chars</span>
    </div>
    <div class="stat" style="margin-left:auto;">
      <div class="stat-dot blue" style="animation-duration:1s;"></div>
      <span class="stat-label" style="color:var(--accent);">synced to local storage</span>
    </div>
  </div>

  <div class="compose" id="compose-box">
    <div class="compose-title-row">
      <input type="text" id="note-title" placeholder="Note title..." maxlength="80" autocomplete="off" />
    </div>
    <div class="tag-picker">
      <button class="tag-btn active" data-tag="idea">Idea</button>
      <button class="tag-btn" data-tag="task">Task</button>
      <button class="tag-btn" data-tag="ref">Reference</button>
      <button class="tag-btn" data-tag="note">Note</button>
    </div>
    <textarea id="note-body" placeholder="Write your thought here..." rows="4" maxlength="1000"></textarea>
    <div class="compose-footer">
      <span class="char-count"><span id="char-counter">0</span> / 1000 chars</span>
      <button class="btn-save" id="btn-save">
        Save Note
      </button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search notes..." autocomplete="off" />
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="idea">Ideas</button>
      <button class="filter-tab" data-filter="task">Tasks</button>
      <button class="filter-tab" data-filter="ref">Refs</button>
      <button class="filter-tab" data-filter="note">Notes</button>
    </div>
  </div>

  <div class="section-heading" id="notes-label">Your Notes</div>
  <div class="notes-grid" id="notes-grid"></div>

  <footer>
    <p>Nimbus Notes — built with <span>HTML · CSS · JavaScript</span></p>
    <p>Data stored via <span>LocalStorage API</span> · No server needed</p>
  </footer>
</div>

<div class="toast" id="toast">
  <span>☁</span> <span id="toast-msg">Note saved!</span>
</div>

<script src="script.js"></script>
</body>
</html>
